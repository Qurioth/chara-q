# 開発タスクの入口。Task は組み込みのシェル（mvdan/sh）で動くので Windows でも同じ書き方で動く。
# bash 専用の書き方は使わない。ツールは mise で入っている前提（先に `mise install` を実行する）。
version: "3"

vars:
  API_DIR: apps/api
  WEB_DIR: apps/web
  WEB_PKG: "@chara-q/web"
  # goose は依存が多いため、本体の go.mod ではなく tools/go.mod の tool で管理する
  GOOSE: go tool -modfile=tools/go.mod goose
  MIGRATIONS_DIR: db/migrations

# apps/api/.env は api のタスクだけで読み込む（全体で読み込むと PORT などが web にも渡ってしまう）。
# タスク単位の dotenv のパスは、そのタスクの dir からの相対パスになる。

tasks:
  default:
    cmds:
      - task --list

  setup:
    desc: 初回セットアップ（.env の作成、依存パッケージのインストール）
    cmds:
      - task: env:init
      - pnpm install
      - task: setup:api

  setup:api:
    dir: "{{.API_DIR}}"
    cmds:
      - go mod download
      - go mod download -modfile=tools/go.mod

  env:init:
    desc: .env.example から .env を作る（既にあれば何もしない）
    cmds:
      - test -f {{.API_DIR}}/.env || cp {{.API_DIR}}/.env.example {{.API_DIR}}/.env
      - test -f {{.WEB_DIR}}/.env || cp {{.WEB_DIR}}/.env.example {{.WEB_DIR}}/.env

  dev:
    desc: api と web を起動する（先に `task db:up` が必要）
    deps: [dev:api, dev:web]

  dev:api:
    desc: api を起動する
    dir: "{{.API_DIR}}"
    dotenv: [.env]
    cmds:
      - go run ./cmd/server

  dev:web:
    desc: web を起動する
    cmds:
      - pnpm --filter {{.WEB_PKG}} dev

  dev:web:https:
    desc: web を https://localhost:3000 で起動する（Safari で Secure の Cookie を確かめるとき。自己署名の証明書を端末に登録する）
    cmds:
      - pnpm --filter {{.WEB_PKG}} dev --experimental-https

  generate:
    desc: すべての生成コードを更新する（gqlgen、sqlc、GraphQL Code Generator）
    cmds:
      - task: generate:api
      - task: generate:web

  generate:api:
    desc: sqlc と gqlgen のコードを生成する
    dir: "{{.API_DIR}}"
    cmds:
      - sqlc generate
      - go tool gqlgen generate

  generate:web:
    desc: GraphQL Code Generator で web の型を生成する
    cmds:
      - pnpm --filter {{.WEB_PKG}} codegen

  check:generated:
    desc: 生成コードを再生成し、コミット済みの内容と差分がないことを確認する
    cmds:
      - task: generate
      - |
        changes=$(git status --porcelain -- {{.API_DIR}} {{.WEB_DIR}}/src/gql)
        if [ -n "$changes" ]; then
          echo "生成コードがコミット済みの内容と一致しません。task generate を実行してコミットしてください:"
          echo "$changes"
          exit 1
        fi

  lint:
    desc: api と web の静的チェック
    cmds:
      - task: lint:api
      - task: lint:web

  lint:api:
    desc: gofmt / goimports、go vet、golangci-lint
    dir: "{{.API_DIR}}"
    cmds:
      - golangci-lint fmt --diff ./...
      - go vet ./...
      - golangci-lint run ./...

  lint:web:
    desc: ESLint と型チェック
    cmds:
      - pnpm --filter {{.WEB_PKG}} lint
      - pnpm --filter {{.WEB_PKG}} typecheck

  fmt:
    desc: Go のコードを整形する
    dir: "{{.API_DIR}}"
    cmds:
      - golangci-lint fmt ./...

  test:
    desc: テストを実行する（api と web。api の DB を使うテストには `task db:up` が必要）
    cmds:
      - task: test:api
      - task: test:web

  test:api:
    desc: api のテスト（テスト用の DB を用意してから実行する）
    dir: "{{.API_DIR}}"
    dotenv: [.env]
    cmds:
      - task: db:test:prepare
      # DB を使うテストは表を空にするため、パッケージを並列に実行しない
      - go test -p 1 ./...

  test:web:
    desc: web のテスト（API と DB は不要）
    cmds:
      - pnpm --filter {{.WEB_PKG}} test

  build:
    desc: api と web をビルドする
    cmds:
      - task: build:api
      - task: build:web

  build:api:
    dir: "{{.API_DIR}}"
    cmds:
      - go build -o bin/server ./cmd/server

  build:web:
    cmds:
      - pnpm --filter {{.WEB_PKG}} build

  docker:build:
    desc: api の Docker イメージをビルドする
    cmds:
      - docker build -t chara-q-api:local {{.API_DIR}}

  db:up:
    desc: ローカルの Postgres と S3 互換ストレージを起動する
    cmds:
      - docker compose up -d --wait --quiet-pull

  db:down:
    desc: ローカルの Postgres と S3 互換ストレージを停止する（データは残る）
    cmds:
      - docker compose down

  db:migrate:
    desc: マイグレーションを最新まで適用する
    dir: "{{.API_DIR}}"
    dotenv: [.env]
    cmds:
      - '{{.GOOSE}} -dir {{.MIGRATIONS_DIR}} postgres "$DATABASE_URL" up'

  db:status:
    desc: マイグレーションの適用状況を表示する
    dir: "{{.API_DIR}}"
    dotenv: [.env]
    cmds:
      - '{{.GOOSE}} -dir {{.MIGRATIONS_DIR}} postgres "$DATABASE_URL" status'

  db:reset:
    desc: ローカル DB のマイグレーションをすべて戻してから最新まで適用し直す
    prompt: ローカル DB のデータがすべて消えます。続けますか？
    dir: "{{.API_DIR}}"
    dotenv: [.env]
    cmds:
      - '{{.GOOSE}} -dir {{.MIGRATIONS_DIR}} postgres "$DATABASE_URL" reset'
      - '{{.GOOSE}} -dir {{.MIGRATIONS_DIR}} postgres "$DATABASE_URL" up'

  # 管理者の操作（specs/002-auth/contracts/admin-commands.md）。接続先は apps/api/.env の DATABASE_URL。
  # 本番の DB に対して実行するときは、シェルで DATABASE_URL を設定してから実行する（dotenv はシェルの値を上書きしない）
  admin:create:
    desc: "管理者ユーザーを作る。パスワードは入力を求める（例: task admin:create -- -login-id admin -display-name 管理者）"
    dir: "{{.API_DIR}}"
    dotenv: [.env]
    interactive: true
    requires:
      vars: [CLI_ARGS]
    cmds:
      - go run ./cmd/admin create-admin{{range .CLI_ARGS_LIST}} {{shellQuote .}}{{end}}

  admin:users:
    desc: ユーザーの一覧を表示する
    dir: "{{.API_DIR}}"
    dotenv: [.env]
    cmds:
      - go run ./cmd/admin users

  admin:reset-code:
    desc: "パスワードの再設定コードを発行する（例: task admin:reset-code -- <ログイン ID>）"
    dir: "{{.API_DIR}}"
    dotenv: [.env]
    requires:
      vars: [CLI_ARGS]
    cmds:
      - go run ./cmd/admin reset-code{{range .CLI_ARGS_LIST}} {{shellQuote .}}{{end}}

  admin:disable:
    desc: "ユーザーを無効にし、ログイン状態を切る（例: task admin:disable -- <ログイン ID>）"
    dir: "{{.API_DIR}}"
    dotenv: [.env]
    requires:
      vars: [CLI_ARGS]
    cmds:
      - go run ./cmd/admin disable{{range .CLI_ARGS_LIST}} {{shellQuote .}}{{end}}

  admin:enable:
    desc: "無効にしたユーザーを有効に戻す（例: task admin:enable -- <ログイン ID>）"
    dir: "{{.API_DIR}}"
    dotenv: [.env]
    requires:
      vars: [CLI_ARGS]
    cmds:
      - go run ./cmd/admin enable{{range .CLI_ARGS_LIST}} {{shellQuote .}}{{end}}

  db:test:prepare:
    desc: テスト用の DB（chara_q_test）がなければ作り、マイグレーションを最新まで適用する
    dir: "{{.API_DIR}}"
    dotenv: [.env]
    cmds:
      # テストは表を空にするため、開発用の DB とは別のデータベースを使う
      - >-
        echo "SELECT 'CREATE DATABASE chara_q_test' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'chara_q_test') \gexec"
        | docker compose exec -T postgres psql -U chara_q -d chara_q -v ON_ERROR_STOP=1 -q
      - '{{.GOOSE}} -dir {{.MIGRATIONS_DIR}} postgres "$TEST_DATABASE_URL" up'

  db:new:
    desc: "マイグレーションファイルを作る（例: task db:new -- create_character_sheets）"
    dir: "{{.API_DIR}}"
    requires:
      vars: [CLI_ARGS]
    cmds:
      - "{{.GOOSE}} -dir {{.MIGRATIONS_DIR}} -s create {{.CLI_ARGS}} sql"
