name: ci-api

on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - schema/**
      - mise.toml
      - .github/workflows/ci-api.yml
  pull_request:
    paths:
      - apps/api/**
      - schema/**
      - mise.toml
      - .github/workflows/ci-api.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/api

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        # compose.yaml と同じバージョン
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: chara_q
          POSTGRES_PASSWORD: chara_q
          POSTGRES_DB: chara_q
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chara_q -d chara_q"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://chara_q:chara_q@localhost:5432/chara_q?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.22

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('apps/api/go.sum', 'apps/api/tools/go.sum', 'mise.toml') }}
          restore-keys: go-${{ runner.os }}-

      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt で整形されていないファイルがあります:"
            echo "$files"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        run: golangci-lint run ./...

      - name: マイグレーションを適用
        run: go tool -modfile=tools/go.mod goose -dir db/migrations postgres "$TEST_DATABASE_URL" up

      - name: go test
        run: go test -race ./...

      - name: 生成コードに差分がないことを確認（sqlc / gqlgen）
        run: |
          sqlc generate
          go tool gqlgen generate
          changes=$(git status --porcelain -- .)
          if [ -n "$changes" ]; then
            echo "生成コードがコミット済みの内容と一致しません。task generate を実行してコミットしてください:"
            echo "$changes"
            git diff
            exit 1
          fi

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker イメージをビルド（push はしない）
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/api
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
