# gqlgen の設定。スキーマはリポジトリ直下の schema/graphql を直接読む（コピーしない）
schema:
  - ../../schema/graphql/*.graphqls

exec:
  package: graph
  layout: single-file
  filename: internal/graph/generated.go

model:
  package: model
  filename: internal/graph/model/models_gen.go

resolver:
  package: graph
  layout: follow-schema
  dir: internal/graph
  filename_template: "{name}.resolvers.go"

omit_gqlgen_version_in_file_notice: true
# interface の getter を作らない。シートの型は所有者を ID だけで持つため（internal/graph/model/sheet.go）
omit_getters: true

models:
  JSON:
    model:
      - github.com/Qurioth/chara-q/apps/api/internal/graph/scalar.JSON
  Time:
    model:
      - github.com/99designs/gqlgen/graphql.Time
  # シートの型は手で書く（specs/003-character-sheet-base の research R3）。owner は DataLoader で引く
  YuyakekoyakeSheet:
    model:
      - github.com/Qurioth/chara-q/apps/api/internal/graph/model.YuyakekoyakeSheet
    fields:
      owner:
        resolver: true
  BeginningIdolSheet:
    model:
      - github.com/Qurioth/chara-q/apps/api/internal/graph/model.BeginningIdolSheet
    fields:
      owner:
        resolver: true
